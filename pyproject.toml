[build-system]
requires = ["setuptools==75.3.2"]
build-backend = "setuptools.build_meta"

[project]
name = "chipevo-benchmark"
version = "0.2.0"
description = "Fixed-memory, cycle-preserving RTL optimization benchmark"
requires-python = ">=3.10"
dependencies = ["pyslang==11.0.0"]

[project.scripts]
chipevo = "chipevo.cli:main"

[tool.setuptools.packages.find]
include = ["chipevo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tools", "artifacts", "archive", "designs", ".venv"]
